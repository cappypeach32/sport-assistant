<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#05060a"/>
<link rel="manifest" href="/static/manifest.webmanifest"/>
<link rel="stylesheet" href="/static/tablet.css"/>
<title>Stream Prep — AI Sports</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg: #05060a; --surface: #0d0f17; --surface2: #131620;
    --border: rgba(255,255,255,0.08);
    --green: #00ff99; --blue: #4d9fff; --purple: #a78bfa;
    --muted: #7a8499; --text: #eef1f6; --yellow: #eab308;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
}
a { color: var(--blue); text-decoration: none; font-weight: 600; }
.top {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface); position: sticky; top: 0; z-index: 10;
}
.top h1 { font-size: 1.1rem; font-weight: 800; }
.top-links { display: flex; gap: 14px; font-size: 0.85rem; flex-wrap: wrap; }
.layout {
    display: grid;
    grid-template-columns: minmax(260px, 320px) 1fr;
    min-height: calc(100vh - 57px);
}
@media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .match-panel { max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
}
.match-panel {
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex; flex-direction: column;
    overflow: hidden;
}
.match-panel-head {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
}
.match-panel-head h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.toolbar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn-sm {
    padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.04); color: var(--muted);
    font-size: 0.75rem; font-weight: 700; cursor: pointer;
}
.btn-sm:hover { border-color: var(--green); color: var(--green); }
.match-list { flex: 1; overflow-y: auto; padding: 8px; }
.match-item {
    padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s;
}
.match-item:hover { border-color: rgba(0,255,153,0.35); }
.match-item.active { border-color: var(--green); background: rgba(0,255,153,0.08); }
.match-teams { font-size: 0.95rem; font-weight: 700; line-height: 1.35; }
.match-meta { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
.date-group { font-size: 0.7rem; font-weight: 800; color: var(--purple); padding: 8px 6px 4px; text-transform: uppercase; letter-spacing: 0.06em; }
.kit-panel { overflow-y: auto; padding: 20px 24px 48px; }
.kit-empty {
    text-align: center; padding: 4rem 1.5rem; color: var(--muted);
    font-size: 1.05rem; line-height: 1.5;
}
.kit-header {
    margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
}
.kit-title { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 800; line-height: 1.25; }
.kit-meta { font-size: 0.9rem; color: var(--muted); margin-top: 6px; }
.kit-actions {
    display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px;
}
.btn {
    padding: 10px 18px; border-radius: 10px; font-size: 0.9rem; font-weight: 700;
    border: 1px solid var(--border); cursor: pointer; background: var(--surface2); color: var(--text);
}
.btn-primary { background: var(--green); color: #000; border-color: var(--green); }
.btn-primary:hover { filter: brightness(1.05); }
.btn:hover { border-color: var(--blue); }
.kit-loading {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.25);
    border-radius: 10px; margin-bottom: 16px; font-size: 0.85rem; color: var(--purple);
}
.spinner {
    width: 18px; height: 18px; border: 2px solid rgba(167,139,250,0.3);
    border-top-color: var(--purple); border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 1.1rem 1.25rem; margin-bottom: 14px;
}
.section-title {
    font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--purple); margin-bottom: 0.75rem;
}
.bullet { padding: 0.45rem 0; font-size: 0.95rem; line-height: 1.45; border-bottom: 1px solid var(--border); }
.bullet:last-child { border-bottom: none; }
.fact { display: flex; gap: 8px; padding: 8px 0; font-size: 0.95rem; line-height: 1.45; }
.fact::before { content: "💡"; flex-shrink: 0; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
.team-box {
    background: var(--surface2); border-radius: 10px; padding: 12px;
    border: 1px solid var(--border);
}
.team-name { font-weight: 800; font-size: 0.95rem; margin-bottom: 8px; }
.form-str { font-family: monospace; letter-spacing: 2px; font-size: 1rem; margin: 6px 0; }
.stat-line { font-size: 0.82rem; color: var(--muted); line-height: 1.5; }
.player { padding: 8px 0; border-bottom: 1px solid var(--border); }
.player-name { font-weight: 700; font-size: 0.9rem; }
.player-stat { font-size: 0.8rem; color: var(--green); margin-top: 3px; }
.point-title { font-weight: 800; color: var(--green); font-size: 0.95rem; margin-bottom: 4px; }
.point-text { font-size: 0.9rem; line-height: 1.5; color: var(--text); padding-bottom: 10px; }
.guide-block {
    font-size: 0.88rem; line-height: 1.55; white-space: pre-wrap;
    max-height: 400px; overflow-y: auto; color: var(--muted);
}
</style>
</head>
<body>

<div class="top">
    <h1>📋 Stream Prep Kit</h1>
    <div class="top-links">
        <a href="/overlay">← Overlay</a>
        <a href="/overlay/commentator" target="_blank">🎙️ Коментатор</a>
    </div>
</div>

<div class="layout">
    <aside class="match-panel">
        <div class="match-panel-head">
            <h2>Предстоящи мачове</h2>
            <div class="toolbar">
                <button type="button" class="btn-sm" onclick="loadUpcoming(true)">↻ Обнови</button>
            </div>
        </div>
        <div class="match-list" id="match-list">
            <div class="kit-empty" style="padding:2rem 1rem">Зареждане...</div>
        </div>
    </aside>

    <main class="kit-panel" id="kit-panel">
        <div class="kit-empty" id="kit-placeholder">
            Избери предстоящ мач отляво.<br/>
            Ще се генерира пакет с факти, форма, H2H, играчи и говорни точки за ефира.
        </div>
        <div id="kit-content" style="display:none"></div>
    </main>
</div>

<script>
const state = {
    matches: [],
    byDate: {},
    selectedId: null,
    selectedMatch: null,
    pollTimer: null,
};

function esc(s) {
    const d = document.createElement("div");
    d.textContent = s ?? "";
    return d.innerHTML;
}

function formatKickoff(iso) {
    if (!iso) return "—";
    try {
        const d = new Date(iso);
        return d.toLocaleString("bg-BG", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    } catch { return iso; }
}

function formatDateLabel(dateStr) {
    try {
        const d = new Date(dateStr + "T12:00:00");
        return d.toLocaleDateString("bg-BG", { weekday: "long", day: "numeric", month: "long" });
    } catch { return dateStr; }
}

async function loadUpcoming(refresh = false) {
    const list = document.getElementById("match-list");
    list.innerHTML = '<div class="kit-empty" style="padding:2rem 1rem">Зареждане...</div>';
    try {
        const url = refresh ? "/upcoming?refresh=true" : "/upcoming";
        const res = await fetch(url);
        const data = await res.json();
        state.matches = data.upcoming || [];
        state.byDate = data.by_date || {};
        renderMatchList();
    } catch (e) {
        list.innerHTML = '<div class="kit-empty">Грешка при зареждане</div>';
    }
}

function renderMatchList() {
    const list = document.getElementById("match-list");
    if (!state.matches.length) {
        list.innerHTML = '<div class="kit-empty" style="padding:2rem 1rem">Няма предстоящи мачове</div>';
        return;
    }
    const dates = Object.keys(state.byDate).sort();
    let html = "";
    for (const date of dates) {
        html += `<div class="date-group">${esc(formatDateLabel(date))}</div>`;
        for (const m of state.byDate[date]) {
            const id = String(m.raw_id);
            const active = state.selectedId === id ? " active" : "";
            html += `<div class="match-item${active}" data-id="${esc(id)}" onclick="selectPrepMatch('${id}')">
                <div class="match-teams">${esc(m.home)} — ${esc(m.away)}</div>
                <div class="match-meta">${esc(m.competition || "")} · ${esc(formatKickoff(m.start_time))}</div>
            </div>`;
        }
    }
    list.innerHTML = html;
}

function stopPoll() {
    if (state.pollTimer) {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
    }
}

function startPoll(fixtureId) {
    stopPoll();
    state.pollTimer = setInterval(() => loadKit(fixtureId, false), 8000);
}

async function selectPrepMatch(id) {
    state.selectedId = id;
    state.selectedMatch = state.matches.find(m => String(m.raw_id) === String(id)) || null;
    renderMatchList();
    await loadKit(id, true);
    startPoll(id);
}

async function loadKit(fixtureId, showSpinner) {
    const placeholder = document.getElementById("kit-placeholder");
    const content = document.getElementById("kit-content");
    placeholder.style.display = "none";
    content.style.display = "block";

    if (showSpinner) {
        content.innerHTML = '<div class="kit-loading"><div class="spinner"></div> Генериране на stream kit...</div>';
    }

    try {
        const res = await fetch(`/prep/${fixtureId}`);
        const data = await res.json();
        if (!data.ok) {
            content.innerHTML = `<div class="kit-empty">${esc(data.error || "Грешка")}</div>`;
            stopPoll();
            return;
        }
        if (data.match && !state.selectedMatch) {
            state.selectedMatch = data.match;
        }
        renderKit(data.match, data.kit);
        if (!data.kit?.loading?.gpt_guide && !data.kit?.loading?.stream_facts) {
            stopPoll();
        }
    } catch (e) {
        content.innerHTML = '<div class="kit-empty">Грешка при зареждане на kit</div>';
    }
}

function renderFormBlock(side, label) {
    if (!side?.available) {
        return `<div class="team-box"><div class="team-name">${esc(label)}</div><div class="stat-line">Няма данни</div></div>`;
    }
    const avgS = side.avg_score != null ? Number(side.avg_score).toFixed(2) : "—";
    const avgC = side.avg_conc != null ? Number(side.avg_conc).toFixed(2) : "—";
    return `<div class="team-box">
        <div class="team-name">${esc(label)}</div>
        <div class="form-str">${esc(side.form_str || "—")}</div>
        <div class="stat-line">${side.wins}П ${side.draws}Р ${side.losses}З · ${side.scored}:${side.conceded}</div>
        <div class="stat-line">Средно ${avgS} вкарани / ${avgC} допуснати</div>
        ${side.source_label ? `<div class="stat-line">${esc(side.source_label)}</div>` : ""}
    </div>`;
}

function renderPlayers(players, color) {
    if (!players?.length) return '<div class="stat-line">Няма данни</div>';
    return players.map(p => `<div class="player">
        <div class="player-name">${esc(p.name)}</div>
        <div class="player-stat" style="color:${color}">${esc(p.label || "")}</div>
    </div>`).join("");
}

function renderKit(match, kit) {
    if (!kit?.ready) {
        document.getElementById("kit-content").innerHTML = '<div class="kit-empty">Данните не са налични</div>';
        return;
    }

    const home = match?.home || "";
    const away = match?.away || "";
    const loading = kit.loading?.gpt_guide || kit.loading?.stream_facts;

    let html = `<div class="kit-header">
        <div class="kit-title">${esc(home)} срещу ${esc(away)}</div>
        <div class="kit-meta">${esc(kit.competition)} · ${esc(formatKickoff(match?.start_time))}</div>
        <div class="kit-actions">
            <button type="button" class="btn btn-primary" onclick="goLive()">▶ Зареди в ефир</button>
            <button type="button" class="btn" onclick="window.open('/overlay/commentator','_blank')">🎙️ Коментатор</button>
            <button type="button" class="btn" onclick="copyKit()">📋 Копирай kit</button>
            <button type="button" class="btn" onclick="loadKit(${state.selectedId}, true)">↻ Обнови</button>
        </div>
    </div>`;

    if (loading) {
        html += `<div class="kit-loading"><div class="spinner"></div> AI текстът се доразработва — автоматично обновяване...</div>`;
    }

    if (kit.stream_facts?.length) {
        html += `<div class="section"><div class="section-title">💡 Интересни факти</div>
            ${kit.stream_facts.map(f => `<div class="fact">${esc(f)}</div>`).join("")}
        </div>`;
    }

    html += `<div class="section"><div class="section-title">📊 Форма</div>
        <div class="grid-2">
            ${renderFormBlock(kit.form?.home, home)}
            ${renderFormBlock(kit.form?.away, away)}
        </div>
    </div>`;

    if (kit.standings?.reliable) {
        const hst = kit.standings.home || {};
        const ast = kit.standings.away || {};
        html += `<div class="section"><div class="section-title">🏆 Класиране</div>
            <div class="grid-2">
                <div class="stat-line"><strong>${esc(home)}</strong>: ${hst.position}. място · ${hst.points} т. · ${hst.played} мача</div>
                <div class="stat-line"><strong>${esc(away)}</strong>: ${ast.position}. място · ${ast.points} т. · ${ast.played} мача</div>
            </div>
        </div>`;
    }

    if (kit.h2h?.rows?.length) {
        html += `<div class="section"><div class="section-title">⚔️ Директни срещи (H2H)</div>
            ${kit.h2h.rows.slice(0, 5).map(r => `<div class="bullet">${esc(r)}</div>`).join("")}
            <div class="stat-line" style="margin-top:8px">${kit.h2h.count} срещи · средно ${kit.h2h.avg_goals} гола · ${esc(home)} ${kit.h2h.home_wins}П · ${esc(away)} ${kit.h2h.away_wins}П</div>
            ${kit.h2h.latest_scorers ? `<div class="stat-line" style="margin-top:4px;color:var(--green)">${esc(kit.h2h.latest_scorers)}</div>` : ""}
        </div>`;
    }

    if (kit.key_players?.home?.length || kit.key_players?.away?.length) {
        html += `<div class="section"><div class="section-title">⭐ Ключови играчи</div>
            <div class="grid-2">
                <div>${renderPlayers(kit.key_players.home, "var(--green)")}</div>
                <div>${renderPlayers(kit.key_players.away, "var(--blue)")}</div>
            </div>
        </div>`;
    }

    if (kit.talking_points?.length) {
        html += `<div class="section"><div class="section-title">🎙️ Говорни точки</div>
            ${kit.talking_points.map(p => `<div><div class="point-title">${esc(p.title)}</div><div class="point-text">${esc(p.text)}</div></div>`).join("")}
        </div>`;
    } else if (kit.key_factors?.length) {
        html += `<div class="section"><div class="section-title">🎙️ Ключови теми</div>
            ${kit.key_factors.map(f => `<div class="bullet">${esc(f)}</div>`).join("")}
        </div>`;
    }

    if (kit.historical_facts?.length) {
        html += `<div class="section"><div class="section-title">📜 Исторически факти</div>
            ${kit.historical_facts.map(f => `<div class="bullet">${esc(f)}</div>`).join("")}
        </div>`;
    }

    if (kit.group_scenarios?.available && kit.group_scenarios.bullets?.length) {
        html += `<div class="section"><div class="section-title">📈 Сценарий за групата</div>
            ${kit.group_scenarios.bullets.map(b => `<div class="bullet">${esc(b)}</div>`).join("")}
        </div>`;
    }

    const ch = kit.coaches?.home, ca = kit.coaches?.away;
    const ref = kit.referee || {};
    if (ch || ca || ref.name) {
        html += `<div class="section"><div class="section-title">👥 Екип & съдия</div>`;
        if (ch || ca) html += `<div class="stat-line">Треньори: ${esc(ch || "—")} (${esc(home)}) · ${esc(ca || "—")} (${esc(away)})</div>`;
        if (ref.name) {
            html += `<div class="stat-line" style="margin-top:6px">Съдия: ${esc(ref.name)}`;
            if (ref.cards_profile) html += ` — ${esc(ref.cards_profile)}`;
            html += `</div>`;
        }
        html += `</div>`;
    }

    const injH = kit.injuries?.home || [], injA = kit.injuries?.away || [];
    if (injH.length || injA.length) {
        html += `<div class="section"><div class="section-title">🏥 Контузии / наказания</div>`;
        if (injH.length) html += `<div class="stat-line"><strong>${esc(home)}</strong>: ${injH.map(i => esc(i.name) + (i.reason ? ` (${esc(i.reason)})` : "")).join(", ")}</div>`;
        if (injA.length) html += `<div class="stat-line" style="margin-top:6px"><strong>${esc(away)}</strong>: ${injA.map(i => esc(i.name) + (i.reason ? ` (${esc(i.reason)})` : "")).join(", ")}</div>`;
        html += `</div>`;
    }

    if (kit.broadcast_guide) {
        const badge = kit.has_gpt_guide ? "✓ AI Broadcast Guide" : "Guide от API данни";
        html += `<div class="section"><div class="section-title">📖 Пълен broadcast guide <span style="color:var(--muted);font-weight:600">(${badge})</span></div>
            <div class="guide-block">${esc(kit.broadcast_guide)}</div>
        </div>`;
    }

    document.getElementById("kit-content").innerHTML = html;
    state._lastKitText = buildPlainText(match, kit);
}

function buildPlainText(match, kit) {
    const lines = [`STREAM PREP — ${match?.home} vs ${match?.away}`, kit.competition, ""];
    if (kit.stream_facts?.length) {
        lines.push("ИНТЕРЕСНИ ФАКТИ");
        kit.stream_facts.forEach(f => lines.push(`• ${f}`));
        lines.push("");
    }
    if (kit.talking_points?.length) {
        lines.push("ГОВОРНИ ТОЧКИ");
        kit.talking_points.forEach(p => lines.push(`${p.title}: ${p.text}`));
        lines.push("");
    }
    if (kit.key_factors?.length) {
        lines.push("КЛЮЧОВИ ФАКТОРИ");
        kit.key_factors.forEach(f => lines.push(`• ${f}`));
    }
    return lines.join("\n");
}

async function copyKit() {
    const text = state._lastKitText || "";
    if (!text) return;
    try {
        await navigator.clipboard.writeText(text);
        alert("Копирано в клипборда");
    } catch {
        prompt("Копирай:", text);
    }
}

async function goLive() {
    const m = state.selectedMatch;
    if (!m?.raw_id) {
        alert("Избери мач първо");
        return;
    }
    try {
        await fetch("/select-match", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ match: m }),
        });
        window.location.href = "/overlay";
    } catch {
        alert("Грешка при зареждане в ефир");
    }
}

document.addEventListener("DOMContentLoaded", () => {
    loadUpcoming();
    const params = new URLSearchParams(location.search);
    const fid = params.get("fixture");
    if (fid) {
        setTimeout(() => selectPrepMatch(fid), 600);
    }
});
</script>
</body>
</html>
