<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#05060a"/>
<link rel="manifest" href="/static/manifest.webmanifest"/>
<link rel="stylesheet" href="/static/tablet.css"/>
<title>Подготовка за ефир — AI Sports</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg: #05060a; --surface: #0d0f17; --surface2: #131620;
    --border: rgba(255,255,255,0.08);
    --green: #00ff99; --blue: #4d9fff; --purple: #a78bfa;
    --muted: #7a8499; --text: #eef1f6; --yellow: #eab308;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh;
}
a { color: var(--blue); text-decoration: none; font-weight: 600; }
.top {
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap;
    gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--border);
    background: var(--surface); position: sticky; top: 0; z-index: 10;
}
.top h1 { font-size: 1.1rem; font-weight: 800; }
.top-links { display: flex; gap: 14px; font-size: 0.85rem; flex-wrap: wrap; }
.layout {
    display: grid;
    grid-template-columns: minmax(260px, 320px) 1fr;
    min-height: calc(100vh - 57px);
}
@media (max-width: 900px) {
    .layout { grid-template-columns: 1fr; }
    .match-panel { max-height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
}
.match-panel {
    border-right: 1px solid var(--border);
    background: var(--surface);
    display: flex; flex-direction: column;
    overflow: hidden;
}
.match-panel-head {
    padding: 14px 16px; border-bottom: 1px solid var(--border);
}
.match-panel-head h2 { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
.toolbar { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn-sm {
    padding: 6px 10px; border-radius: 8px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.04); color: var(--muted);
    font-size: 0.75rem; font-weight: 700; cursor: pointer;
}
.btn-sm:hover { border-color: var(--green); color: var(--green); }
.match-list { flex: 1; overflow-y: auto; padding: 8px; }
.match-item {
    padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border);
    margin-bottom: 8px; cursor: pointer; transition: border-color 0.15s;
}
.match-item:hover { border-color: rgba(0,255,153,0.35); }
.match-item.active { border-color: var(--green); background: rgba(0,255,153,0.08); }
.match-teams { font-size: 0.95rem; font-weight: 700; line-height: 1.35; }
.match-meta { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
.date-group { font-size: 0.7rem; font-weight: 800; color: var(--purple); padding: 8px 6px 4px; text-transform: uppercase; letter-spacing: 0.06em; }
.kit-panel { overflow-y: auto; padding: 20px 24px 48px; }
.kit-empty {
    text-align: center; padding: 4rem 1.5rem; color: var(--muted);
    font-size: 1.05rem; line-height: 1.5;
}
.kit-header {
    margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border);
}
.kit-title { font-size: clamp(1.4rem, 3vw, 2rem); font-weight: 800; line-height: 1.25; }
.kit-meta { font-size: 0.9rem; color: var(--muted); margin-top: 6px; }
.kit-actions {
    display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px;
}
.btn {
    padding: 10px 18px; border-radius: 10px; font-size: 0.9rem; font-weight: 700;
    border: 1px solid var(--border); cursor: pointer; background: var(--surface2); color: var(--text);
}
.btn-primary { background: var(--green); color: #000; border-color: var(--green); }
.btn-primary:hover { filter: brightness(1.05); }
.btn:hover { border-color: var(--blue); }
.kit-loading {
    display: flex; align-items: center; gap: 10px; padding: 12px 16px;
    background: rgba(167,139,250,0.1); border: 1px solid rgba(167,139,250,0.25);
    border-radius: 10px; margin-bottom: 16px; font-size: 0.85rem; color: var(--purple);
}
.kit-loading.large {
    flex-direction: column; align-items: center; justify-content: center;
    text-align: center; min-height: 280px; padding: 3rem 1.5rem;
    font-size: 1rem; line-height: 1.55;
}
.kit-loading.large .spinner { width: 36px; height: 36px; border-width: 3px; }
.spinner {
    width: 18px; height: 18px; border: 2px solid rgba(167,139,250,0.3);
    border-top-color: var(--purple); border-radius: 50%;
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
.section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 1.1rem 1.25rem; margin-bottom: 14px;
}
.section-title {
    font-size: 0.72rem; font-weight: 800; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--purple); margin-bottom: 0.75rem;
}
.bullet { padding: 0.45rem 0; font-size: 0.95rem; line-height: 1.45; border-bottom: 1px solid var(--border); }
.bullet:last-child { border-bottom: none; }
.fact { display: flex; gap: 8px; padding: 8px 0; font-size: 0.95rem; line-height: 1.45; }
.fact::before { content: "💡"; flex-shrink: 0; }
.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 600px) { .grid-2 { grid-template-columns: 1fr; } }
.team-box {
    background: var(--surface2); border-radius: 10px; padding: 12px;
    border: 1px solid var(--border);
}
.team-name { font-weight: 800; font-size: 0.95rem; margin-bottom: 8px; }
.form-str { font-family: monospace; letter-spacing: 2px; font-size: 1rem; margin: 6px 0; }
.stat-line { font-size: 0.82rem; color: var(--muted); line-height: 1.5; }
.player { padding: 8px 0; border-bottom: 1px solid var(--border); }
.player-name { font-weight: 700; font-size: 0.9rem; }
.player-stat { font-size: 0.8rem; color: var(--green); margin-top: 3px; }
.point-title { font-weight: 800; color: var(--green); font-size: 0.95rem; margin-bottom: 4px; }
.point-text { font-size: 0.9rem; line-height: 1.5; color: var(--text); padding-bottom: 10px; }
.guide-block {
    font-size: 0.88rem; line-height: 1.55; white-space: pre-wrap;
    max-height: 400px; overflow-y: auto; color: var(--muted);
}
.editorial-hero {
    font-size: 1.05rem; line-height: 1.65; color: var(--text);
    margin-bottom: 18px; padding: 16px 18px;
    background: linear-gradient(135deg, rgba(0,255,153,0.06), rgba(77,159,255,0.06));
    border: 1px solid rgba(0,255,153,0.15); border-radius: 14px;
}
.editorial-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 1.15rem 1.3rem; margin-bottom: 14px;
}
.editorial-section.highlight {
    border-color: rgba(234,179,8,0.35);
    background: linear-gradient(180deg, rgba(234,179,8,0.06), var(--surface));
}
.editorial-title {
    font-size: 0.78rem; font-weight: 800; letter-spacing: 0.07em;
    text-transform: uppercase; color: var(--purple); margin-bottom: 0.85rem;
}
.ed-sub {
    font-size: 0.95rem; font-weight: 800; color: var(--green);
    margin: 1rem 0 0.5rem;
}
.ed-p { font-size: 0.95rem; line-height: 1.6; margin: 0.4rem 0; }
.ed-num { font-size: 0.95rem; line-height: 1.55; margin: 0.5rem 0; padding-left: 0.25rem; }
.ed-check { font-size: 0.92rem; line-height: 1.5; margin: 0.35rem 0; }
.ed-diagram {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.78rem; line-height: 1.35; color: var(--blue);
    background: rgba(77,159,255,0.06); border: 1px solid rgba(77,159,255,0.15);
    border-radius: 10px; padding: 12px 14px; margin: 10px 0; overflow-x: auto;
    white-space: pre;
}
.formations-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 4px;
}
@media (max-width: 800px) { .formations-grid { grid-template-columns: 1fr; } }
.formation-team-card {
    background: var(--surface2); border-radius: 14px;
    border: 1px solid var(--border); overflow: hidden;
}
.formation-team-card .ed-sub { margin: 0; padding: 12px 14px 8px; }
.formation-scheme-badge {
    display: inline-block; font-size: 0.8rem; font-weight: 800;
    padding: 5px 12px; border-radius: 999px; margin: 0 0 10px;
    background: rgba(0,255,153,0.14); color: var(--green);
    border: 1px solid rgba(0,255,153,0.28); letter-spacing: 0.05em;
}
.formation-card-body { padding: 0 12px 12px; }
.pitch-pro {
    position: relative; width: 100%; aspect-ratio: 2/3; max-height: 400px;
    border-radius: 12px; overflow: hidden;
    background: repeating-linear-gradient(
        180deg,
        #3a9d5c 0px, #3a9d5c 28px,
        #348f54 28px, #348f54 56px
    );
    box-shadow: inset 0 0 0 2px rgba(255,255,255,0.35), 0 4px 20px rgba(0,0,0,0.35);
}
.pitch-pro-field {
    position: absolute; inset: 10px;
    border: 2px solid rgba(255,255,255,0.45); border-radius: 4px;
    pointer-events: none;
}
.pitch-pro-field::before {
    content: ""; position: absolute; top: 50%; left: 0; right: 0; height: 2px;
    background: rgba(255,255,255,0.35); transform: translateY(-50%);
}
.pitch-pro-field::after {
    content: ""; position: absolute; top: 50%; left: 50%;
    width: 22%; aspect-ratio: 1; border: 2px solid rgba(255,255,255,0.35);
    border-radius: 50%; transform: translate(-50%, -50%);
}
.pitch-pro-box-top, .pitch-pro-box-bottom {
    position: absolute; left: 50%; transform: translateX(-50%);
    width: 44%; height: 16%; border: 2px solid rgba(255,255,255,0.3);
    pointer-events: none;
}
.pitch-pro-box-top { top: 10px; border-top: none; }
.pitch-pro-box-bottom { bottom: 10px; border-bottom: none; }
.pitch-pro-inner {
    position: absolute; inset: 14px 6px;
    display: flex; flex-direction: column-reverse;
    justify-content: space-between; z-index: 1;
}
.pitch-pro-line {
    display: flex; justify-content: space-evenly; align-items: flex-end;
    gap: 2px; padding: 0 2px;
}
.pitch-pro-player {
    display: flex; flex-direction: column; align-items: center;
    flex: 1; min-width: 0; max-width: 76px;
}
.pitch-pro-dot {
    width: 36px; height: 36px; border-radius: 50%;
    background: linear-gradient(145deg, #1a1f2e, #0d1018);
    border: 2.5px solid #fff;
    box-shadow: 0 2px 8px rgba(0,0,0,0.45);
    flex-shrink: 0;
}
.pitch-pro-dot.gk {
    border-color: #fbbf24;
    background: linear-gradient(145deg, #5c4a12, #3d2f08);
}
.pitch-pro-name {
    margin-top: 5px; font-size: 0.62rem; font-weight: 800;
    color: #fff; text-align: center; line-height: 1.2;
    text-shadow: 0 1px 4px rgba(0,0,0,0.9);
    word-break: break-word; max-width: 100%;
}
.formation-tactics {
    padding: 10px 14px 14px; font-size: 0.86rem; line-height: 1.5;
    border-top: 1px solid var(--border); color: var(--muted);
}
.formation-tactics strong { color: var(--text); font-size: 0.8rem; }
.formation-tactics ul { margin: 6px 0 0; padding-left: 1.15rem; }
.formation-tactics li { margin: 4px 0; color: var(--text); }
.draft-badge {
    display: inline-block; font-size: 0.7rem; font-weight: 800;
    padding: 3px 8px; border-radius: 6px; margin-left: 8px;
    background: rgba(234,179,8,0.15); color: var(--yellow); vertical-align: middle;
}
.warn-banner {
    display: flex; align-items: flex-start; gap: 10px; padding: 12px 16px;
    background: rgba(234,179,8,0.1); border: 1px solid rgba(234,179,8,0.3);
    border-radius: 10px; margin-bottom: 16px; font-size: 0.85rem; line-height: 1.45;
    color: var(--yellow);
}
.ref-block { margin-top: 20px; }
.ref-block summary {
    cursor: pointer; font-size: 0.8rem; font-weight: 800;
    color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em;
    padding: 10px 0; list-style: none;
}
.ref-block summary::-webkit-details-marker { display: none; }
.ref-inner { padding-top: 8px; }
</style>
</head>
<body>

<div class="top">
    <h1>📋 Подготовка за ефир</h1>
    <div class="top-links">
        <a href="/overlay">← Overlay (live)</a>
        <a href="/overlay/commentator" target="_blank">🎙️ Коментатор</a>
    </div>
</div>

<div class="layout">
    <aside class="match-panel">
        <div class="match-panel-head">
            <h2>Предстоящи мачове</h2>
            <div class="toolbar">
                <button type="button" class="btn-sm" onclick="loadUpcoming(true)">↻ Обнови</button>
            </div>
        </div>
        <div class="match-list" id="match-list">
            <div class="kit-empty" style="padding:2rem 1rem">Зареждане...</div>
        </div>
    </aside>

    <main class="kit-panel" id="kit-panel">
        <div class="kit-empty" id="kit-placeholder">
            Избери предстоящ мач отляво.<br/>
            Ще получиш детайлен анализ: контекст, схеми, ключови играчи, тактика и прогноза за ефира.
        </div>
        <div id="kit-content" style="display:none"></div>
    </main>
</div>

<script>
const state = {
    matches: [],
    byDate: {},
    selectedId: null,
    selectedMatch: null,
    pollTimer: null,
};

function esc(s) {
    const d = document.createElement("div");
    d.textContent = s ?? "";
    return d.innerHTML;
}

function formatKickoff(iso) {
    if (!iso) return "—";
    try {
        const d = new Date(iso);
        return d.toLocaleString("bg-BG", { weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
    } catch { return iso; }
}

function formatDateLabel(dateStr) {
    try {
        const d = new Date(dateStr + "T12:00:00");
        return d.toLocaleDateString("bg-BG", { weekday: "long", day: "numeric", month: "long" });
    } catch { return dateStr; }
}

async function loadUpcoming(refresh = false) {
    const list = document.getElementById("match-list");
    list.innerHTML = '<div class="kit-empty" style="padding:2rem 1rem">Зареждане...</div>';
    try {
        const url = refresh ? "/upcoming?refresh=true" : "/upcoming";
        const res = await fetch(url);
        const data = await res.json();
        state.matches = data.upcoming || [];
        state.byDate = data.by_date || {};
        renderMatchList();
    } catch (e) {
        list.innerHTML = '<div class="kit-empty">Грешка при зареждане</div>';
    }
}

function renderMatchList() {
    const list = document.getElementById("match-list");
    if (!state.matches.length) {
        list.innerHTML = '<div class="kit-empty" style="padding:2rem 1rem">Няма предстоящи мачове</div>';
        return;
    }
    const dates = Object.keys(state.byDate).sort();
    let html = "";
    for (const date of dates) {
        html += `<div class="date-group">${esc(formatDateLabel(date))}</div>`;
        for (const m of state.byDate[date]) {
            const id = String(m.raw_id);
            const active = state.selectedId === id ? " active" : "";
            html += `<div class="match-item${active}" data-id="${esc(id)}" onclick="selectPrepMatch('${id}')">
                <div class="match-teams">${esc(m.home)} — ${esc(m.away)}</div>
                <div class="match-meta">${esc(m.competition || "")} · ${esc(formatKickoff(m.start_time))}</div>
            </div>`;
        }
    }
    list.innerHTML = html;
}

function stopPoll() {
    if (state.pollTimer) {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
    }
}

function startPoll(fixtureId) {
    stopPoll();
    state.pollTimer = setInterval(() => loadKit(fixtureId, false), 4000);
}

async function selectPrepMatch(id) {
    state.selectedId = id;
    state.selectedMatch = state.matches.find(m => String(m.raw_id) === String(id)) || null;
    renderMatchList();
    await loadKit(id, true);
}

async function loadKit(fixtureId, showSpinner) {
    const placeholder = document.getElementById("kit-placeholder");
    const content = document.getElementById("kit-content");
    placeholder.style.display = "none";
    content.style.display = "block";

    if (showSpinner) {
        content.innerHTML = '<div class="kit-loading large"><div class="spinner"></div><div>Генериране на детайлен AI анализ…<br/><span style="color:var(--muted);font-size:0.9rem">Моля изчакай — отнема до 1–2 минути</span></div></div>';
    }

    try {
        const res = await fetch(`/prep/${fixtureId}${showSpinner ? "?refresh=true" : ""}`);
        const data = await res.json();
        if (!data.ok) {
            content.innerHTML = `<div class="kit-empty">${esc(data.error || "Грешка")}</div>`;
            stopPoll();
            return;
        }
        if (data.match && !state.selectedMatch) {
            state.selectedMatch = data.match;
        }
        renderKit(data.match, data.kit);
        const loading = data.kit?.loading;
        if (!loading?.prep_editorial || data.kit?.prep_editorial_failed || data.kit?.prep_ai_unavailable) {
            stopPoll();
        }
    } catch (e) {
        content.innerHTML = '<div class="kit-empty">Грешка при зареждане на kit</div>';
    }
}

function renderFormBlock(side, label) {
    if (!side?.available) {
        return `<div class="team-box"><div class="team-name">${esc(label)}</div><div class="stat-line">Няма данни</div></div>`;
    }
    const avgS = side.avg_score != null ? Number(side.avg_score).toFixed(2) : "—";
    const avgC = side.avg_conc != null ? Number(side.avg_conc).toFixed(2) : "—";
    return `<div class="team-box">
        <div class="team-name">${esc(label)}</div>
        <div class="form-str">${esc(side.form_str || "—")}</div>
        <div class="stat-line">${side.wins}П ${side.draws}Р ${side.losses}З · ${side.scored}:${side.conceded}</div>
        <div class="stat-line">Средно ${avgS} вкарани / ${avgC} допуснати</div>
        ${side.source_label ? `<div class="stat-line">${esc(side.source_label)}</div>` : ""}
    </div>`;
}

function renderPlayers(players, color) {
    if (!players?.length) return '<div class="stat-line">Няма данни</div>';
    return players.map(p => `<div class="player">
        <div class="player-name">${esc(p.name)}</div>
        <div class="player-stat" style="color:${color}">${esc(p.label || "")}</div>
    </div>`).join("");
}

function formatInline(s) {
    let e = esc(s);
    e = e.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    return e;
}

function displayPlayerName(name) {
    if (!name) return name;
    const map = state._nameMap || {};
    for (const [latin, bg] of Object.entries(map)) {
        if (latin.toLowerCase() === String(name).toLowerCase()) return bg;
    }
    return name;
}

function stripCodeFences(text) {
    return (text || "").replace(/```[\w]*\n?/g, "").trim();
}

function cleanPlayerName(s) {
    return (s || "").replace(/\*\*/g, "").replace(/\([^)]*\)/g, "").replace(/^\d+[\.\)]\s*/, "").trim();
}

function isPlaceholderName(name) {
    const n = (name || "").trim().toLowerCase();
    return !n || ["име", "name", "играч", "player", "n/a", "tbd", "xxx", "—", "-"].includes(n);
}

function isPlayerToken(w) {
    if (!w || w.length < 2 || w.length > 26) return false;
    if (/^\[/.test(w) || /^[\d]+$/.test(w)) return false;
    if (/^(гол|вратар|десен|ляв|цент|напад|крило|полуза|бек|защит|опорен|схема|основна)/i.test(w)) return false;
    if (/^[А-ЯЁ][а-яё\-]{1,}$/.test(w)) return true;
    if (/^[A-Za-zÀ-ÿ][A-Za-zÀ-ÿ\.\-']{1,}$/.test(w)) return true;
    return false;
}

function parseNameLine(line) {
    let t = (line || "").trim();
    if (!t) return [];
    t = t.replace(/^[•\-\*⭐]+\s*/, "").trim();
    if (/^(основна|тактическ|вероятна\s+схема|състав)/i.test(t)) return [];

    const roleMatch = t.match(
        /^(?:вратар|защитник|халф|нападател|полузащитник|gk|def|mid|fwd)[^:]*:\s*(.+)$/i
    );
    if (roleMatch) {
        const name = cleanPlayerName(roleMatch[1]);
        return name && !isPlaceholderName(name) ? [name] : [];
    }

    if (t.includes(",") && t.split(",").every(p => cleanPlayerName(p).length <= 28)) {
        return t.split(",")
            .map(cleanPlayerName)
            .filter(n => n && !isPlaceholderName(n) && n.length >= 2);
    }

    const single = cleanPlayerName(t.replace(/\[([^\]]+)\]/g, "").trim());
    if (single && single.length >= 2 && !isPlaceholderName(single)) {
        const beforeDash = single.split(/\s*[-–—]\s+/)[0].trim();
        if (beforeDash.length >= 2 && !/^(вратар|защитник|халф|нападател)/i.test(beforeDash)) {
            return [beforeDash];
        }
    }
    return [];
}

function shortPlayerName(full) {
    const n = displayPlayerName(full);
    if (!n || isPlaceholderName(n)) return "";
    const parts = n.split(/\s+/).filter(Boolean);
    if (parts.length > 1 && parts[parts.length - 1].length >= 2) return parts[parts.length - 1];
    return n;
}

function parseSchemeString(scheme) {
    if (!scheme) return null;
    const m = scheme.match(/([\d]+(?:\s*[-/]\s*[\d]+)+)/);
    if (!m) return null;
    const parts = m[1].replace(/\s/g, "").split(/[-/]/).map(Number);
    if (parts.some(n => isNaN(n) || n < 1)) return null;
    return [1, ...parts];
}

function schemePlayerCount(scheme) {
    const lines = parseSchemeString(scheme);
    return lines ? lines.reduce((a, b) => a + b, 0) : 11;
}

function buildFormationRows(scheme, players) {
    const lines = parseSchemeString(scheme);
    if (!lines) return null;
    const need = lines.reduce((a, b) => a + b, 0);
    const xi = players.filter(n => n && !isPlaceholderName(n)).slice(0, need);
    if (xi.length < 8) return null;

    const rows = [];
    let i = 0;
    for (const n of lines) {
        const slice = xi.slice(i, i + n);
        if (!slice.length) break;
        rows.push(slice.map(name => ({ name })));
        i += n;
    }
    return rows.length ? rows : null;
}

function rowsFromSchemeAndPlayers(scheme, players) {
    return buildFormationRows(scheme, players);
}

function collectPlayersInOrder(text) {
    const players = [];
    const raw = stripCodeFences(text);
    let hitTactics = false;
    const maxPlayers = schemePlayerCount(extractScheme(text));

    for (const line of raw.split("\n")) {
        if (players.length >= maxPlayers) break;
        const t = line.trim();
        if (!t) continue;
        if (/^основна\s+тактическ/i.test(t)) { hitTactics = true; continue; }
        if (hitTactics && /^[•\-\*]/.test(t)) continue;
        if (hitTactics && /[а-яА-Я]/.test(t) && !isPlayerToken(t.split(/\s+/)[0])) continue;
        if (/(?:вероятна\s+)?схема\s*:/i.test(t)) continue;
        if (/^\[([^\]]+)\](\s*\[[^\]]+\])*\s*$/.test(t)) continue;

        for (const name of parseNameLine(t)) {
            if (name && !isPlaceholderName(name)) {
                players.push(name);
                if (players.length >= maxPlayers) break;
            }
        }
    }
    return players;
}

function collectTactics(text) {
    const tactics = [];
    let inTactics = false;
    for (const line of stripCodeFences(text).split("\n")) {
        const t = line.trim();
        if (/^основна\s+тактическ/i.test(t)) { inTactics = true; continue; }
        if (!inTactics) continue;
        if (/^[•\-\*]\s+/.test(t)) tactics.push(t.replace(/^[•\-\*]\s+/, ""));
        else if (t && /[а-яА-Я]/.test(t)) tactics.push(t);
    }
    return tactics;
}

function extractScheme(text) {
    const m = stripCodeFences(text).match(/(?:вероятна\s+)?схема\s*:?\s*([\d]+(?:\s*[-/]\s*[\d]+)+)/i);
    return m ? m[1].replace(/\s/g, "") : "";
}

function parseFormationContent(text) {
    const scheme = extractScheme(text);
    const players = collectPlayersInOrder(text);
    const tactics = collectTactics(text);
    const rows = buildFormationRows(scheme, players);
    return { scheme, rows: rows || [], tactics, players: players.slice(0, schemePlayerCount(scheme)) };
}

function renderFormationPitch(rows) {
    if (!rows?.length) return "";
    return `<div class="pitch-pro">
        <div class="pitch-pro-field"></div>
        <div class="pitch-pro-box-top"></div>
        <div class="pitch-pro-box-bottom"></div>
        <div class="pitch-pro-inner">
            ${rows.map((row, ri) => {
                const isGk = ri === 0 && row.length === 1;
                return `<div class="pitch-pro-line">${row.map((p, pi) => {
                    const gk = isGk || (ri === 0 && /вратар|nyland|keeper|goal/i.test(p.name || ""));
                    return `<div class="pitch-pro-player">
                        <div class="pitch-pro-dot${gk ? " gk" : ""}"></div>
                        <div class="pitch-pro-name">${esc(shortPlayerName(p.name))}</div>
                    </div>`;
                }).join("")}</div>`;
            }).join("")}
        </div>
    </div>`;
}

function renderFormationHTML(parsed) {
    if (!parsed.rows?.length) return "";
    let html = `<div class="formation-card-body">`;
    if (parsed.scheme) {
        html += `<div class="formation-scheme-badge">${esc(parsed.scheme)}</div>`;
    }
    html += renderFormationPitch(parsed.rows);
    html += `</div>`;
    if (parsed.tactics?.length) {
        html += `<div class="formation-tactics"><strong>Тактическа идея</strong><ul>
            ${parsed.tactics.map(t => `<li>${formatInline(t)}</li>`).join("")}
        </ul></div>`;
    }
    return html;
}

function tryRenderFormation(text, teamName, kit, teamIndex) {
    let squad = resolveFormationSquad(teamName, kit?.formation_squads, kit?.teams);
    if (!squad?.players?.length && kit?.formation_squads) {
        const side = teamIndex === 0 ? "home" : teamIndex === 1 ? "away" : null;
        if (side && kit.formation_squads[side]?.players?.length) {
            squad = kit.formation_squads[side];
        }
    }
    const scheme = squad?.scheme || extractScheme(text) || "4-3-3";
    const tactics = collectTactics(text);
    const need = schemePlayerCount(scheme);

    let players = [];
    if (squad?.players?.length >= 8) {
        players = squad.players.slice(0, need);
    } else {
        players = collectPlayersInOrder(text).slice(0, need);
    }
    players = players.filter(n => n && !isPlaceholderName(n));

    const rows = buildFormationRows(scheme, players);
    if (!rows) return null;
    return renderFormationHTML({ scheme, rows, tactics, players });
}

function resolveFormationSquad(teamName, squads, teams) {
    if (!squads || !teamName) return null;
    const t = teamName.toLowerCase().trim();
    for (const side of ["home", "away"]) {
        const squad = squads[side];
        const label = (teams?.[side] || "").toLowerCase().trim();
        if (!squad?.players?.length) continue;
        if (label && (t === label || label.includes(t) || t.includes(label))) return squad;
        if ((squad.team_label || "").toLowerCase().trim() === t) return squad;
    }
    return null;
}

function renderFormationsSection(body, kit) {
    const chunks = body.split(/(?=^### )/m).filter(c => c.trim());
    if (!chunks.length) return formatEditorialBody(body);

    const cards = chunks.map((chunk, teamIndex) => {
        chunk = chunk.trim();
        let teamName = "";
        let rest = chunk;
        if (chunk.startsWith("### ")) {
            const nl = chunk.indexOf("\n");
            teamName = nl > 0 ? chunk.slice(4, nl).trim() : chunk.slice(4).trim();
            rest = nl > 0 ? chunk.slice(nl + 1) : "";
        }
        const formationHtml = tryRenderFormation(rest, teamName, kit, teamIndex);
        const extra = formationHtml ? "" : formatParagraphs(rest);
        return `<div class="formation-team-card">
            ${teamName ? `<h4 class="ed-sub">${esc(teamName)}</h4>` : ""}
            ${formationHtml || extra}
        </div>`;
    }).join("");

    return `<div class="formations-grid">${cards}</div>`;
}

function looksLikeDiagramBlock(text) {
    const lines = text.split("\n").filter(l => l.trim());
    if (lines.length < 2) return false;
    const diagramish = lines.filter(l =>
        /^\s{3,}\S/.test(l) ||
        (/^[а-яА-Яa-zA-Z]/.test(l) && (l.match(/\s{2,}/g) || []).length >= 1)
    );
    return diagramish.length >= Math.min(2, lines.length);
}

function formatParagraphs(text) {
    return text.split(/\n\n+/).map(p => {
        p = p.trim();
        if (!p) return "";
        const formationHtml = tryRenderFormation(p);
        if (formationHtml) return formationHtml;
        if (looksLikeDiagramBlock(p)) {
            const parsed = parseFormationContent(p);
            if (parsed.rows.length) return renderFormationHTML(parsed);
            return `<pre class="ed-diagram">${esc(stripCodeFences(p))}</pre>`;
        }
        const lines = p.split("\n").map(l => {
            const t = l.trim();
            if (!t) return "";
            if (/^[✅❌⭐]/.test(t)) return `<div class="ed-check">${formatInline(t)}</div>`;
            if (/^\d+\.\s/.test(t)) return `<div class="ed-num">${formatInline(t)}</div>`;
            if (t.startsWith("• ") || t.startsWith("- ")) return `<div class="ed-p">${formatInline(t)}</div>`;
            return formatInline(t);
        }).filter(Boolean);
        if (lines.every(x => x.startsWith("<div"))) return lines.join("");
        return `<p class="ed-p">${lines.join("<br/>")}</p>`;
    }).join("");
}

function formatEditorialBody(body) {
    if (!body) return "";
    const blocks = body.split(/(?=^### )/m);
    return blocks.map(block => {
        block = block.trim();
        if (!block) return "";
        if (block.startsWith("### ")) {
            const nl = block.indexOf("\n");
            const h = nl > 0 ? block.slice(4, nl).trim() : block.slice(4).trim();
            const rest = nl > 0 ? block.slice(nl + 1) : "";
            return `<h4 class="ed-sub">${esc(h)}</h4>${formatParagraphs(rest)}`;
        }
        return formatParagraphs(block);
    }).join("");
}

function renderEditorialSections(prep, kit) {
    if (!prep?.sections?.length) return "";
    let html = "";
    for (const sec of prep.sections) {
        const titleUp = (sec.title || "").toUpperCase();
        if (titleUp === "ЗАГЛАВИЕ") continue;
        const extra = titleUp === "АНАЛИЗ И ОЧАКВАН СЦЕНАРИЙ" ? " highlight" : "";
        if (titleUp === "УВОД") {
            html += `<div class="editorial-hero">${formatEditorialBody(sec.body)}</div>`;
            continue;
        }
        if (titleUp === "ВЕРОЯТНИ СХЕМИ") {
            html += `<div class="editorial-section${extra}">
                <div class="editorial-title">${sec.icon || "📄"} ${esc(sec.title)}</div>
                ${renderFormationsSection(sec.body, kit)}
            </div>`;
            continue;
        }
        html += `<div class="editorial-section${extra}">
            <div class="editorial-title">${sec.icon || "📄"} ${esc(sec.title)}</div>
            ${formatEditorialBody(sec.body)}
        </div>`;
    }
    return html;
}

function renderReferenceData(kit, home, away) {
    let html = "";
    if (kit.stream_facts?.length) {
        html += `<div class="section"><div class="section-title">💡 Интересни факти</div>
            ${kit.stream_facts.map(f => `<div class="fact">${esc(f)}</div>`).join("")}
        </div>`;
    }
    html += `<div class="section"><div class="section-title">📊 Форма</div>
        <div class="grid-2">
            ${renderFormBlock(kit.form?.home, home)}
            ${renderFormBlock(kit.form?.away, away)}
        </div>
    </div>`;
    if (kit.standings?.reliable) {
        const hst = kit.standings.home || {};
        const ast = kit.standings.away || {};
        html += `<div class="section"><div class="section-title">🏆 Класиране</div>
            <div class="grid-2">
                <div class="stat-line"><strong>${esc(home)}</strong>: ${hst.position}. място · ${hst.points} т. · ${hst.played} мача</div>
                <div class="stat-line"><strong>${esc(away)}</strong>: ${ast.position}. място · ${ast.points} т. · ${ast.played} мача</div>
            </div>
        </div>`;
    }
    if (kit.h2h?.rows?.length) {
        html += `<div class="section"><div class="section-title">⚔️ Директни срещи (H2H)</div>
            ${kit.h2h.rows.slice(0, 5).map(r => `<div class="bullet">${esc(r)}</div>`).join("")}
            <div class="stat-line" style="margin-top:8px">${kit.h2h.count} срещи · средно ${kit.h2h.avg_goals} гола · ${esc(home)} ${kit.h2h.home_wins}П · ${esc(away)} ${kit.h2h.away_wins}П</div>
            ${kit.h2h.latest_scorers ? `<div class="stat-line" style="margin-top:4px;color:var(--green)">${esc(kit.h2h.latest_scorers)}</div>` : ""}
        </div>`;
    }
    if (kit.key_players?.home?.length || kit.key_players?.away?.length) {
        html += `<div class="section"><div class="section-title">⭐ Ключови играчи (API)</div>
            <div class="grid-2">
                <div>${renderPlayers(kit.key_players.home, "var(--green)")}</div>
                <div>${renderPlayers(kit.key_players.away, "var(--blue)")}</div>
            </div>
        </div>`;
    }
    const ch = kit.coaches?.home, ca = kit.coaches?.away;
    const ref = kit.referee || {};
    if (ch || ca || ref.name) {
        html += `<div class="section"><div class="section-title">👥 Екип & съдия</div>`;
        if (ch || ca) html += `<div class="stat-line">Треньори: ${esc(ch || "—")} (${esc(home)}) · ${esc(ca || "—")} (${esc(away)})</div>`;
        if (ref.name) {
            html += `<div class="stat-line" style="margin-top:6px">Съдия: ${esc(ref.name)}`;
            if (ref.cards_profile) html += ` — ${esc(ref.cards_profile)}`;
            html += `</div>`;
        }
        html += `</div>`;
    }
    const injH = kit.injuries?.home || [], injA = kit.injuries?.away || [];
    if (injH.length || injA.length) {
        html += `<div class="section"><div class="section-title">🏥 Контузии / наказания</div>`;
        if (injH.length) html += `<div class="stat-line"><strong>${esc(home)}</strong>: ${injH.map(i => esc(i.name) + (i.reason ? ` (${esc(i.reason)})` : "")).join(", ")}</div>`;
        if (injA.length) html += `<div class="stat-line" style="margin-top:6px"><strong>${esc(away)}</strong>: ${injA.map(i => esc(i.name) + (i.reason ? ` (${esc(i.reason)})` : "")).join(", ")}</div>`;
        html += `</div>`;
    }
    if (kit.talking_points?.length) {
        html += `<div class="section"><div class="section-title">🎙️ Говорни точки (broadcast)</div>
            ${kit.talking_points.map(p => `<div><div class="point-title">${esc(p.title)}</div><div class="point-text">${esc(p.text)}</div></div>`).join("")}
        </div>`;
    }
    return html;
}

function renderKit(match, kit) {
    if (!kit?.ready) {
        document.getElementById("kit-content").innerHTML = '<div class="kit-empty">Данните не са налични</div>';
        return;
    }

    const home = match?.home || "";
    const away = match?.away || "";
    const prep = kit.prep_editorial || {};
    const hasGpt = prep.is_gpt && (prep.sections?.length || prep.text);
    const loading = kit.loading?.prep_editorial;
    const gptBadge = hasGpt ? '<span class="draft-badge" style="background:rgba(0,255,153,0.15);color:var(--green)">AI анализ</span>' : "";

    let html = `<div class="kit-header">
        <div class="kit-title">${esc(hasGpt ? (kit.headline || `${home} срещу ${away}`) : `${home} срещу ${away}`)}${gptBadge}</div>
        <div class="kit-meta">${esc(kit.competition)} · ${esc(formatKickoff(match?.start_time))}</div>
        <div class="kit-actions">
            <button type="button" class="btn btn-primary" onclick="goLive()"${loading ? " disabled" : ""}>▶ Зареди в ефир</button>
            <button type="button" class="btn" onclick="window.open('/overlay/commentator','_blank')">🎙️ Коментатор</button>
            <button type="button" class="btn" onclick="copyKit()"${hasGpt ? "" : " disabled"}>📋 Копирай анализ</button>
            <button type="button" class="btn" onclick="loadKit(${state.selectedId}, true)">↻ Обнови</button>
        </div>
    </div>`;

    if (loading) {
        html += `<div class="kit-loading large">
            <div class="spinner"></div>
            <div>Генериране на детайлен AI анализ…<br/><span style="color:var(--muted);font-size:0.9rem">Обикновено отнема до 1–2 минути</span></div>
        </div>`;
    } else if (kit.prep_ai_unavailable) {
        html += `<div class="warn-banner">⚠️ AI анализът не е наличен (липсва OpenAI ключ на сървъра).</div>`;
    } else if (kit.prep_editorial_failed) {
        html += `<div class="warn-banner">⚠️ AI анализът не успя да се генерира. Натисни <strong>Обнови</strong> за нов опит.</div>`;
    }

    if (hasGpt) {
        if (prep.sections?.length) {
            html += renderEditorialSections(prep, kit);
        } else if (prep.text) {
            html += `<div class="editorial-section"><div class="guide-block" style="max-height:none;color:var(--text)">${esc(prep.text)}</div></div>`;
        }

        const refHtml = renderReferenceData(kit, home, away);
        if (refHtml) {
            html += `<details class="ref-block">
                <summary>📎 Справочни данни (форма, H2H, контузии)</summary>
                <div class="ref-inner">${refHtml}</div>
            </details>`;
        }
    }

    document.getElementById("kit-content").innerHTML = html;
    state._nameMap = kit.player_name_map || {};
    state._lastKitText = buildPlainText(match, kit);
}

function buildPlainText(match, kit) {
    const prep = kit.prep_editorial || {};
    if (!prep.is_gpt || !prep.text) return "";
    const lines = [prep.text, ""];
    if (kit.stream_facts?.length) {
        lines.push("ИНТЕРЕСНИ ФАКТИ");
        kit.stream_facts.forEach(f => lines.push(`• ${f}`));
        lines.push("");
    }
    if (kit.talking_points?.length) {
        lines.push("ГОВОРНИ ТОЧКИ");
        kit.talking_points.forEach(p => lines.push(`${p.title}: ${p.text}`));
        lines.push("");
    }
    return lines.join("\n");
}

async function copyKit() {
    const text = state._lastKitText || "";
    if (!text) return;
    try {
        await navigator.clipboard.writeText(text);
        alert("Копирано в клипборда");
    } catch {
        prompt("Копирай:", text);
    }
}

async function goLive() {
    const m = state.selectedMatch;
    if (!m?.raw_id) {
        alert("Избери мач първо");
        return;
    }
    try {
        await fetch("/select-match", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ match: m }),
        });
        window.location.href = "/overlay";
    } catch {
        alert("Грешка при зареждане в ефир");
    }
}

document.addEventListener("DOMContentLoaded", () => {
    loadUpcoming();
    const params = new URLSearchParams(location.search);
    const fid = params.get("fixture");
    if (fid) {
        setTimeout(() => selectPrepMatch(fid), 600);
    }
});
</script>
