<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#05060a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="manifest" href="/static/manifest.webmanifest"/>
<link rel="apple-touch-icon" href="/static/icon.svg"/>
<link rel="stylesheet" href="/static/tablet.css"/>
<title>Коментатор — AI Sports</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg: #05060a; --surface: #0d0f17; --border: rgba(255,255,255,0.08);
    --green: #00ff99; --blue: #4d9fff; --red: #ff4455; --purple: #a78bfa;
    --muted: #7a8499; --text: #eef1f6;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 20px 24px 40px;
}
.top-bar {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
}
.top-bar a {
    color: var(--blue); text-decoration: none; font-size: 0.9rem; font-weight: 600;
}
.conn { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.conn-dot.ok { background: var(--green); box-shadow: 0 0 8px var(--green); }
.conn-dot.err { background: var(--red); }

.scoreboard {
    text-align: center; padding: 1.75rem 1.25rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; margin-bottom: 1.25rem;
}
.teams { font-size: clamp(1.4rem, 4vw, 2.25rem); font-weight: 800; letter-spacing: -0.02em; }
.score {
    font-size: clamp(3rem, 10vw, 5rem); font-weight: 900;
    color: var(--green); margin: 0.75rem 0; line-height: 1;
}
.meta { font-size: 0.95rem; color: var(--muted); }
.minute {
    display: inline-block; margin-top: 0.6rem; padding: 0.4rem 0.9rem;
    background: var(--red); color: #fff; border-radius: 20px;
    font-size: 1rem; font-weight: 800;
}

.section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 1.25rem 1.4rem; margin-bottom: 1rem;
}
.section-label {
    font-size: 0.75rem; font-weight: 800; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--purple); margin-bottom: 0.9rem;
}
.narrative {
    font-size: clamp(1.25rem, 3.5vw, 1.75rem); line-height: 1.45; font-weight: 500;
}
.point {
    padding: 1rem 0; border-bottom: 1px solid var(--border);
}
.point:last-child { border-bottom: none; }
.point-title {
    font-size: clamp(1.1rem, 3vw, 1.5rem); font-weight: 800;
    color: var(--green); margin-bottom: 0.5rem;
}
.point-text {
    font-size: clamp(1.05rem, 2.8vw, 1.35rem); line-height: 1.5; color: var(--text);
}
.empty, .waiting {
    text-align: center; padding: 3rem 1.25rem; color: var(--muted); font-size: 1.15rem;
}
.alert-btn {
    margin-top: 0.5rem; width: 100%; padding: 0.75rem;
    border-radius: 10px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.04); color: var(--muted);
    font-size: 0.85rem; font-weight: 700; cursor: pointer;
}
.alert-btn.on { border-color: var(--green); color: var(--green); }
</style>
</head>
<body class="tablet-commentator">

<div class="top-bar">
    <div>
        <a href="/overlay">← Пълен overlay</a>
        <div class="tablet-bar" style="margin-top:10px">
            <button type="button" class="tablet-btn" onclick="TabletMode.changeFont(-0.1)">A−</button>
            <button type="button" class="tablet-btn" id="font-scale-label" style="min-width:52px">100%</button>
            <button type="button" class="tablet-btn" onclick="TabletMode.changeFont(0.1)">A+</button>
            <button type="button" class="tablet-btn" id="wake-btn" onclick="TabletMode.toggleWakeLock()">☀️ Екранът да не гаси</button>
            <button type="button" class="tablet-btn" id="pwa-install-btn" style="display:none" onclick="TabletMode.installPwa()">📲 Инсталирай</button>
        </div>
        <button type="button" class="alert-btn" id="alert-btn" onclick="TabletMode.toggleAlerts()">🔔 Аларми (live)</button>
        <p class="tablet-hint">iOS: Safari → Сподели → „На началния екран“</p>
    </div>
    <div class="conn">
        <span class="conn-dot" id="conn-dot"></span>
        <span id="conn-text">Свързване...</span>
    </div>
</div>

<div id="waiting" class="waiting">Изберете мач от пълния overlay</div>

<div id="content" style="display:none">
    <div class="scoreboard">
        <div class="teams" id="teams">—</div>
        <div class="score" id="score">— : —</div>
        <div class="meta" id="competition"></div>
        <div class="minute" id="minute" style="display:none"></div>
    </div>

    <div class="section" id="sec-narrative" style="display:none">
        <div class="section-label">Жив коментар</div>
        <div class="narrative" id="narrative"></div>
    </div>

    <div class="section" id="sec-points" style="display:none">
        <div class="section-label">Говорни точки</div>
        <div id="points"></div>
    </div>

    <div class="section" id="sec-prematch" style="display:none">
        <div class="section-label">Говорни точки (преди старт)</div>
        <div id="prematch-points"></div>
    </div>
</div>

<script src="/static/tablet.js"></script>
<script>
function setConn(ok) {
    document.getElementById("conn-dot").className = "conn-dot " + (ok ? "ok" : "err");
    document.getElementById("conn-text").textContent = ok ? "На живо" : "Прекъсната връзка";
}

function extractTalkingPoints(narrative) {
    if (!narrative) return [];
    const m = narrative.match(/##\s*ГОВОРНИ[\s\S]*?(?=\n## |$)/i);
    if (!m) return [];
    const points = [];
    for (const line of m[0].split("\n")) {
        const hit = line.match(/^\d+\.\s*\*?\*?(.+?)\*?\*?:\s*(.+)$/);
        if (hit) points.push({ title: hit[1].replace(/\*\*/g, "").trim(), text: hit[2].trim() });
    }
    return points.slice(0, 5);
}

function update(data) {
    if (!data || data.type !== "LIVE_UPDATE") return;

    const m = data.match || {};
    if (!m.home) return;

    document.getElementById("waiting").style.display = "none";
    document.getElementById("content").style.display = "block";

    document.getElementById("teams").textContent = `${m.home} — ${m.away}`;
    const hg = m.home_goals, ag = m.away_goals;
    document.getElementById("score").textContent =
        (hg != null && ag != null) ? `${hg} : ${ag}` : "— : —";
    document.getElementById("competition").textContent = m.competition || data.phase || "";

    const minEl = document.getElementById("minute");
    if (data.phase === "live" && m.minute > 0) {
        minEl.textContent = m.minute + "'";
        minEl.style.display = "inline-block";
    } else {
        minEl.style.display = "none";
    }

    const nar = data.live_narrative || "";
    const narSec = document.getElementById("sec-narrative");
    if (nar && data.phase === "live") {
        narSec.style.display = "block";
        document.getElementById("narrative").textContent = nar;
    } else {
        narSec.style.display = "none";
    }

    const pts = data.commentary_queue || [];
    const ptsSec = document.getElementById("sec-points");
    if (pts.length && data.phase === "live") {
        ptsSec.style.display = "block";
        document.getElementById("points").innerHTML = pts.map(p => `
            <div class="point">
                <div class="point-title">${p.title || ""}</div>
                <div class="point-text">${p.text || ""}</div>
            </div>`).join("");
    } else {
        ptsSec.style.display = "none";
    }

    const pmPts = extractTalkingPoints(data.prematch?.gpt_narrative || "");
    const pmSec = document.getElementById("sec-prematch");
    if (pmPts.length && data.phase === "prematch") {
        pmSec.style.display = "block";
        document.getElementById("prematch-points").innerHTML = pmPts.map(p => `
            <div class="point">
                <div class="point-title">${p.title}</div>
                <div class="point-text">${p.text}</div>
            </div>`).join("");
    } else {
        pmSec.style.display = "none";
    }

    TabletMode.checkAlerts(data);
}

function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(`${proto}://${location.host}/ws`);
    socket.onopen = () => setConn(true);
    socket.onclose = () => { setConn(false); setTimeout(connect, 2000); };
    socket.onerror = () => setConn(false);
    socket.onmessage = e => {
        try { update(JSON.parse(e.data)); } catch (err) { console.error(err); }
    };
}

document.addEventListener("DOMContentLoaded", () => {
    TabletMode.init();
    if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission();
    }
    connect();
});
</script>
</body>
</html>
