<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="theme-color" content="#05060a"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="manifest" href="/static/manifest.webmanifest"/>
<link rel="apple-touch-icon" href="/static/icon.svg"/>
<link rel="stylesheet" href="/static/tablet.css"/>
<link rel="stylesheet" href="/static/responsive.css"/>
<title>Коментатор — AI Sports</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg: #05060a; --surface: #0d0f17; --border: rgba(255,255,255,0.08);
    --green: #00ff99; --blue: #4d9fff; --red: #ff4455; --purple: #a78bfa;
    --muted: #7a8499; --text: #eef1f6;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 20px 24px 40px;
}
.top-bar {
    display: flex; align-items: flex-start; justify-content: space-between;
    gap: 12px; margin-bottom: 20px; flex-wrap: wrap;
}
.top-bar a {
    color: var(--blue); text-decoration: none; font-size: 0.9rem; font-weight: 600;
}
.conn { font-size: 0.8rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.conn-dot.ok { background: var(--green); box-shadow: 0 0 8px var(--green); }
.conn-dot.err { background: var(--red); }

.scoreboard {
    text-align: center; padding: 1.75rem 1.25rem;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; margin-bottom: 1.25rem;
}
.teams { font-size: clamp(1.4rem, 4vw, 2.25rem); font-weight: 800; letter-spacing: -0.02em; }
.score {
    font-size: clamp(3rem, 10vw, 5rem); font-weight: 900;
    color: var(--green); margin: 0.75rem 0; line-height: 1;
}
.meta { font-size: 0.95rem; color: var(--muted); }
.minute {
    display: inline-block; margin-top: 0.6rem; padding: 0.4rem 0.9rem;
    background: var(--red); color: #fff; border-radius: 20px;
    font-size: 1rem; font-weight: 800;
}

.section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 1.25rem 1.4rem; margin-bottom: 1rem;
}
.section-label {
    font-size: 0.75rem; font-weight: 800; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--purple); margin-bottom: 0.9rem;
}
.narrative {
    font-size: clamp(1.25rem, 3.5vw, 1.75rem); line-height: 1.45; font-weight: 500;
}
.point {
    padding: 1rem 0; border-bottom: 1px solid var(--border);
}
.point:last-child { border-bottom: none; }
.point-title {
    font-size: clamp(1.1rem, 3vw, 1.5rem); font-weight: 800;
    color: var(--green); margin-bottom: 0.5rem;
}
.point-text {
    font-size: clamp(1.05rem, 2.8vw, 1.35rem); line-height: 1.5; color: var(--text);
}
.empty, .waiting {
    text-align: center; padding: 3rem 1.25rem; color: var(--muted); font-size: 1.15rem;
}
.alert-btn {
    margin-top: 0.5rem; width: 100%; padding: 0.75rem;
    border-radius: 10px; border: 1px solid var(--border);
    background: rgba(255,255,255,0.04); color: var(--muted);
    font-size: 0.85rem; font-weight: 700; cursor: pointer;
}
.alert-btn.on { border-color: var(--green); color: var(--green); }

.section-broadcast {
    border: 2px solid var(--green);
    background: linear-gradient(135deg, rgba(0,255,153,0.12), rgba(77,159,255,0.06));
}
.section-broadcast.halftime { border-color: #f97316; }
.bp-score-lg {
    font-size: clamp(2.5rem, 8vw, 4rem);
    font-weight: 900;
    color: var(--green);
    text-align: center;
    margin: 0.5rem 0 1rem;
}
.bp-stat-lg {
    font-size: clamp(1rem, 2.5vw, 1.2rem);
    color: var(--muted);
    padding: 0.35rem 0;
    border-bottom: 1px solid var(--border);
}
.bp-bullet-lg {
    font-size: clamp(1.15rem, 3vw, 1.45rem);
    line-height: 1.5;
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--border);
}
.bp-wrap-lg {
    font-size: clamp(1.2rem, 3.2vw, 1.55rem);
    line-height: 1.5;
}
</style>
</head>
<body class="tablet-commentator">

<div class="top-bar">
    <div>
        <a href="/overlay">← Пълен overlay</a>
        <div class="tablet-bar" style="margin-top:10px">
            <button type="button" class="tablet-btn" id="wake-btn" onclick="TabletMode.toggleWakeLock()">☀️ Екранът да не гаси</button>
            <button type="button" class="tablet-btn" id="pwa-install-btn" style="display:none" onclick="TabletMode.installPwa()">📲 Инсталирай</button>
        </div>
        <button type="button" class="alert-btn" id="alert-btn" onclick="TabletMode.toggleAlerts()">🔔 Аларми (live)</button>
        <p class="tablet-hint">iOS: Safari → Сподели → „На началния екран“</p>
    </div>
    <div class="conn">
        <span class="conn-dot" id="conn-dot"></span>
        <span id="conn-text">Свързване...</span>
    </div>
</div>

<div id="waiting" class="waiting">Изберете мач от пълния overlay</div>

<div id="content" style="display:none">
    <div class="scoreboard">
        <div class="teams" id="teams">—</div>
        <div class="score" id="score">— : —</div>
        <div class="meta" id="competition"></div>
        <div class="minute" id="minute" style="display:none"></div>
    </div>

    <div class="section section-broadcast" id="sec-broadcast-package" style="display:none">
        <div class="section-label" id="bp-section-label">Ефирен пакет</div>
        <div class="bp-score-lg" id="bp-score-lg"></div>
        <div id="bp-stats-lg"></div>
        <div id="bp-bullets-lg"></div>
        <div class="bp-wrap-lg" id="bp-wrap-lg"></div>
        <div class="empty" id="bp-loading-lg" style="display:none;padding:0.5rem 0;font-size:0.95rem"></div>
    </div>

    <div class="section" id="sec-narrative" style="display:none">
        <div class="section-label">Жив коментар</div>
        <div class="narrative" id="narrative"></div>
    </div>

    <div class="section" id="sec-points" style="display:none">
        <div class="section-label">Говорни точки</div>
        <div id="points"></div>
    </div>

    <div class="section" id="sec-prematch" style="display:none">
        <div class="section-label">Broadcast guide (преди старт)</div>
        <div id="prematch-guide-status" style="font-size:0.85rem;color:var(--muted);margin-bottom:0.75rem"></div>
        <div id="prematch-guide-sections"></div>
        <div id="prematch-points" style="display:none"></div>
    </div>
</div>

<script src="/static/tablet.js"></script>
<script>
function setConn(ok) {
    document.getElementById("conn-dot").className = "conn-dot " + (ok ? "ok" : "err");
    document.getElementById("conn-text").textContent = ok ? "На живо" : "Прекъсната връзка";
}

function extractTalkingPoints(narrative) {
    if (!narrative) return [];
    const m = narrative.match(/##\s*ГОВОРНИ[\s\S]*?(?=\n## |$)/i);
    if (!m) return [];
    const points = [];
    for (const line of m[0].split("\n")) {
        const hit = line.match(/^\d+\.\s*\*?\*?(.+?)\*?\*?:\s*(.+)$/);
        if (hit) points.push({ title: hit[1].replace(/\*\*/g, "").trim(), text: hit[2].trim() });
    }
    return points.slice(0, 5);
}

function extractGuideSections(narrative) {
    if (!narrative) return [];
    return narrative.split(/\n## /).filter(Boolean).map(block => {
        const nl = block.indexOf("\n");
        const title = (nl > 0 ? block.slice(0, nl) : block).replace(/^## /, "").trim();
        const body  = nl > 0 ? block.slice(nl + 1).trim() : "";
        return { title, body };
    });
}

function update(data) {
    if (!data || data.type !== "LIVE_UPDATE") return;

    const m = data.match || {};
    if (!m.home) return;

    document.getElementById("waiting").style.display = "none";
    document.getElementById("content").style.display = "block";

    document.getElementById("teams").textContent = `${m.home} — ${m.away}`;
    const hg = m.home_goals, ag = m.away_goals;
    document.getElementById("score").textContent =
        (hg != null && ag != null) ? `${hg} : ${ag}` : "— : —";
    document.getElementById("competition").textContent = m.competition || data.phase || "";

    const minEl = document.getElementById("minute");
    if (data.phase === "live" && m.minute > 0) {
        minEl.textContent = m.minute + "'";
        minEl.style.display = "inline-block";
    } else {
        minEl.style.display = "none";
    }

    const pkg = data.broadcast_package || {};
    const bpSec = document.getElementById("sec-broadcast-package");
    if (pkg.active && bpSec) {
        bpSec.style.display = "block";
        bpSec.classList.toggle("halftime", pkg.phase === "halftime");
        document.getElementById("bp-section-label").textContent = pkg.title || "Ефирен пакет";
        document.getElementById("bp-score-lg").textContent = pkg.score_label || "";
        document.getElementById("bp-stats-lg").innerHTML = (pkg.stats_lines || []).map(l =>
            `<div class="bp-stat-lg">${l}</div>`
        ).join("");
        const bulletsEl = document.getElementById("bp-bullets-lg");
        const wrapEl = document.getElementById("bp-wrap-lg");
        const loadEl = document.getElementById("bp-loading-lg");
        if (pkg.phase === "halftime") {
            bulletsEl.innerHTML = (pkg.bullets || []).map(b =>
                `<div class="bp-bullet-lg">▸ ${b}</div>`
            ).join("");
            bulletsEl.style.display = "block";
            wrapEl.style.display = "none";
        } else {
            bulletsEl.style.display = "none";
            wrapEl.style.display = "block";
            wrapEl.textContent = pkg.wrap_up || "";
        }
        if (loadEl) {
            if (pkg.detail_loading) {
                loadEl.style.display = "block";
                loadEl.textContent = pkg.phase === "halftime"
                    ? "GPT полувременен анализ се генерира..."
                    : "GPT финален анализ се генерира...";
            } else {
                loadEl.style.display = "none";
            }
        }
    } else if (bpSec) {
        bpSec.style.display = "none";
    }

    const narSec = document.getElementById("sec-narrative");
    const htFtText = pkg.active
        ? (pkg.phase === "fulltime" ? (data.postmatch_summary || "") : (data.halftime_analysis || ""))
        : "";
    const liveNar = data.live_narrative || "";
    const narText = htFtText || (data.phase === "live" ? liveNar : "");

    if (narText && narSec) {
        narSec.style.display = "block";
        document.getElementById("narrative").textContent = narText;
    } else if (narSec) {
        narSec.style.display = "none";
    }

    const pts = data.commentary_queue || [];
    const ptsSec = document.getElementById("sec-points");
    if (pts.length && data.phase === "live") {
        ptsSec.style.display = "block";
        document.getElementById("points").innerHTML = pts.map(p => `
            <div class="point">
                <div class="point-title">${p.title || ""}</div>
                <div class="point-text">${p.text || ""}</div>
            </div>`).join("");
    } else {
        ptsSec.style.display = "none";
    }

    const pm = data.prematch || {};
    const guideText = pm.gpt_narrative || pm.broadcast_guide_draft || "";
    const pmSec = document.getElementById("sec-prematch");
    const guideEl = document.getElementById("prematch-guide-sections");
    const statusEl = document.getElementById("prematch-guide-status");

    if (guideText && data.phase === "prematch" && pmSec && guideEl) {
        pmSec.style.display = "block";
        const pending = pm.gpt_guide_pending && !pm.gpt_narrative;
        if (statusEl) {
            statusEl.textContent = pending
                ? "⏳ Моментален guide от API — AI текстът се генерира..."
                : (pm.gpt_narrative ? "✓ AI Broadcast Guide" : "Guide от API данни");
        }
        guideEl.innerHTML = extractGuideSections(guideText).map(s => `
            <div class="point">
                <div class="point-title">${s.title}</div>
                <div class="point-text">${s.body.replace(/\*\*(.+?)\*\*/g, "$1").replace(/\n/g, "<br>")}</div>
            </div>`).join("");
    } else if (pmSec) {
        pmSec.style.display = "none";
    }

    const pmPts = extractTalkingPoints(guideText);
    const ptsWrap = document.getElementById("prematch-points");
    if (pmPts.length && data.phase === "prematch" && ptsWrap) {
        ptsWrap.style.display = "none";
    } else if (ptsWrap) {
        ptsWrap.style.display = "none";
    }

    TabletMode.checkAlerts(data);
}

function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(`${proto}://${location.host}/ws`);
    socket.onopen = () => setConn(true);
    socket.onclose = () => { setConn(false); setTimeout(connect, 2000); };
    socket.onerror = () => setConn(false);
    socket.onmessage = e => {
        try { update(JSON.parse(e.data)); } catch (err) { console.error(err); }
    };
}

document.addEventListener("DOMContentLoaded", () => {
    TabletMode.init();
    if ("Notification" in window && Notification.permission === "default") {
        Notification.requestPermission();
    }
    connect();
});
</script>
</body>
</html>
