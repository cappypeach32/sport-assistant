<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Коментатор — AI Sports</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --bg: #05060a; --surface: #0d0f17; --border: rgba(255,255,255,0.08);
    --green: #00ff99; --blue: #4d9fff; --red: #ff4455; --purple: #a78bfa;
    --muted: #7a8499; --text: #eef1f6;
}
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text);
    min-height: 100vh; padding: 20px 24px 40px;
}
.top-bar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; margin-bottom: 24px; flex-wrap: wrap;
}
.top-bar a {
    color: var(--blue); text-decoration: none; font-size: 13px; font-weight: 600;
}
.conn { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.conn-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.conn-dot.ok { background: var(--green); box-shadow: 0 0 8px var(--green); }
.conn-dot.err { background: var(--red); }

.scoreboard {
    text-align: center; padding: 28px 20px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; margin-bottom: 20px;
}
.teams { font-size: clamp(22px, 4vw, 36px); font-weight: 800; letter-spacing: -0.02em; }
.score {
    font-size: clamp(48px, 10vw, 80px); font-weight: 900;
    color: var(--green); margin: 12px 0; line-height: 1;
}
.meta { font-size: 15px; color: var(--muted); }
.minute {
    display: inline-block; margin-top: 10px; padding: 6px 14px;
    background: var(--red); color: #fff; border-radius: 20px;
    font-size: 16px; font-weight: 800;
}

.section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 20px 22px; margin-bottom: 16px;
}
.section-label {
    font-size: 12px; font-weight: 800; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--purple); margin-bottom: 14px;
}
.narrative {
    font-size: clamp(20px, 3.5vw, 28px); line-height: 1.45; font-weight: 500;
}
.point {
    padding: 16px 0; border-bottom: 1px solid var(--border);
}
.point:last-child { border-bottom: none; }
.point-title {
    font-size: clamp(18px, 3vw, 24px); font-weight: 800;
    color: var(--green); margin-bottom: 8px;
}
.point-text {
    font-size: clamp(17px, 2.8vw, 22px); line-height: 1.5; color: var(--text);
}
.empty {
    font-size: 18px; color: var(--muted); text-align: center; padding: 40px 20px;
}
.waiting { text-align: center; padding: 80px 20px; color: var(--muted); font-size: 20px; }
</style>
</head>
<body>

<div class="top-bar">
    <a href="/overlay">← Пълен overlay</a>
    <div class="conn">
        <span class="conn-dot" id="conn-dot"></span>
        <span id="conn-text">Свързване...</span>
    </div>
</div>

<div id="waiting" class="waiting">Изберете мач от пълния overlay</div>

<div id="content" style="display:none">
    <div class="scoreboard">
        <div class="teams" id="teams">—</div>
        <div class="score" id="score">— : —</div>
        <div class="meta" id="competition"></div>
        <div class="minute" id="minute" style="display:none"></div>
    </div>

    <div class="section" id="sec-narrative" style="display:none">
        <div class="section-label">Жив коментар</div>
        <div class="narrative" id="narrative"></div>
    </div>

    <div class="section" id="sec-points" style="display:none">
        <div class="section-label">Говорни точки</div>
        <div id="points"></div>
    </div>

    <div class="section" id="sec-prematch" style="display:none">
        <div class="section-label">Говорни точки (преди старт)</div>
        <div id="prematch-points"></div>
    </div>
</div>

<script>
let _wsOk = false;
let _goalKeys = new Set();
let _lastFixture = null;

function setConn(ok) {
    _wsOk = ok;
    document.getElementById("conn-dot").className = "conn-dot " + (ok ? "ok" : "err");
    document.getElementById("conn-text").textContent = ok ? "На живо" : "Прекъсната връзка";
}

function playBeep() {
    try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.connect(g); g.connect(ctx.destination);
        o.frequency.value = 880;
        g.gain.setValueAtTime(0.15, ctx.currentTime);
        g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        o.start(); o.stop(ctx.currentTime + 0.4);
    } catch (e) {}
}

function notify(title, body) {
    if (Notification.permission === "granted") {
        new Notification(title, { body, icon: "⚽" });
    }
    playBeep();
}

function checkGoals(data) {
    const fid = data.match?.raw_id;
    if (fid !== _lastFixture) {
        _goalKeys.clear();
        _lastFixture = fid;
    }
    for (const ev of (data.events || [])) {
        if (ev.type !== "Goal") continue;
        const key = `${ev.minute}|${ev.team}|${ev.player || ev.message}`;
        if (_goalKeys.has(key)) continue;
        _goalKeys.add(key);
        notify(`⚽ ГОЛ ${ev.minute}'`, `${ev.team} — ${ev.message || ev.player || ""}`);
    }
}

function extractTalkingPoints(narrative) {
    if (!narrative) return [];
    const m = narrative.match(/##\s*ГОВОРНИ[\s\S]*?(?=\n## |$)/i);
    if (!m) return [];
    const block = m[0];
    const points = [];
    for (const line of block.split("\n")) {
        const hit = line.match(/^\d+\.\s*\*?\*?(.+?)\*?\*?:\s*(.+)$/);
        if (hit) points.push({ title: hit[1].replace(/\*\*/g, "").trim(), text: hit[2].trim() });
    }
    return points.slice(0, 5);
}

function update(data) {
    if (!data || data.type !== "LIVE_UPDATE") return;

    const m = data.match || {};
    if (!m.home) return;

    document.getElementById("waiting").style.display = "none";
    document.getElementById("content").style.display = "block";

    document.getElementById("teams").textContent = `${m.home} — ${m.away}`;
    const hg = m.home_goals, ag = m.away_goals;
    document.getElementById("score").textContent =
        (hg != null && ag != null) ? `${hg} : ${ag}` : "— : —";
    document.getElementById("competition").textContent = m.competition || data.phase || "";

    const minEl = document.getElementById("minute");
    if (data.phase === "live" && m.minute > 0) {
        minEl.textContent = m.minute + "'";
        minEl.style.display = "inline-block";
    } else {
        minEl.style.display = "none";
    }

    const nar = data.live_narrative || "";
    const narSec = document.getElementById("sec-narrative");
    if (nar && data.phase === "live") {
        narSec.style.display = "block";
        document.getElementById("narrative").textContent = nar;
    } else {
        narSec.style.display = "none";
    }

    const pts = data.commentary_queue || [];
    const ptsSec = document.getElementById("sec-points");
    if (pts.length && data.phase === "live") {
        ptsSec.style.display = "block";
        document.getElementById("points").innerHTML = pts.map(p => `
            <div class="point">
                <div class="point-title">${p.title || ""}</div>
                <div class="point-text">${p.text || ""}</div>
            </div>`).join("");
    } else {
        ptsSec.style.display = "none";
    }

    const pmPts = extractTalkingPoints(data.prematch?.gpt_narrative || "");
    const pmSec = document.getElementById("sec-prematch");
    if (pmPts.length && data.phase === "prematch") {
        pmSec.style.display = "block";
        document.getElementById("prematch-points").innerHTML = pmPts.map(p => `
            <div class="point">
                <div class="point-title">${p.title}</div>
                <div class="point-text">${p.text}</div>
            </div>`).join("");
    } else {
        pmSec.style.display = "none";
    }

    if (Notification.permission === "granted") checkGoals(data);
}

function connect() {
    const proto = location.protocol === "https:" ? "wss" : "ws";
    const socket = new WebSocket(`${proto}://${location.host}/ws`);
    socket.onopen = () => setConn(true);
    socket.onclose = () => { setConn(false); setTimeout(connect, 2000); };
    socket.onerror = () => setConn(false);
    socket.onmessage = e => {
        try { update(JSON.parse(e.data)); } catch (err) { console.error(err); }
    };
}

if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
}

connect();
</script>
</body>
</html>
